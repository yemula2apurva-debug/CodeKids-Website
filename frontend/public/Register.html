<hr>

<h2>Already have an account?</h2>

<form id="loginForm">

    <label for="loginEmail">Email</label>
    <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
    >

    <label for="loginPassword">Password</label>
    <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required
    >

    <button type="submit">Login</button>

</form>

<p id="loginMessage"></p>
